<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>World Enhancer — Learn the Tools, Enhance the World</title>
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
<style>
  :root{
    --ink:#0d1526; --navy:#101c38; --panel:#1a2748; --panel2:#22335c;
    --line:#3d5a99; --txt:#eef2ff; --sub:#a9bce0; --acc:#ffd94a; --good:#7ee2a0;
    --win:#dfe6f2; --wintx:#1c2436;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    background:var(--ink); color:var(--txt); overflow:hidden;
    user-select:none; -webkit-user-select:none;
  }
  .screen{position:fixed; inset:0; display:none; flex-direction:column}
  .screen.on{display:flex}

  /* ---------- title ---------- */
  #title{
    align-items:center; justify-content:center; gap:22px; padding:24px;
    background:
      linear-gradient(rgba(80,130,255,.10) 1px, transparent 1px),
      linear-gradient(90deg, rgba(80,130,255,.10) 1px, transparent 1px),
      radial-gradient(120% 90% at 50% 0%, #1b2c55 0%, var(--ink) 70%);
    background-size:36px 36px, 36px 36px, 100% 100%;
  }
  #title img.logo{
    width:min(78vw,430px); border-radius:14px;
    box-shadow:0 0 0 3px #ece6d6, 0 0 0 6px #2a3c66, 0 18px 50px rgba(0,0,0,.55);
  }
  .titleBtns{display:flex; flex-direction:column; gap:10px; width:min(78vw,300px)}
  .ver{position:absolute; right:14px; bottom:12px; color:var(--sub); font-size:12px}

  /* ---------- buttons (uniform, full width, left aligned) ---------- */
  .btn{
    display:block; width:100%; padding:13px 16px; text-align:left;
    font-size:16px; font-weight:700; color:var(--txt); white-space:nowrap;
    background:var(--panel2); border:2px solid var(--line); border-radius:10px; cursor:pointer;
  }
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:#2c4a8a; border-color:#6f97e8}
  .btn:disabled{opacity:.38; cursor:default}
  .btn.center{text-align:center}

  /* ---------- desktop ---------- */
  #game{background:linear-gradient(160deg,#274b73 0%,#1d3a5f 45%,#2c5d50 130%)}
  #statusbar{
    display:flex; align-items:center; gap:10px; padding:8px 12px;
    background:rgba(10,17,34,.92); border-bottom:2px solid var(--line);
    font-size:13px; flex-wrap:wrap;
  }
  #statusbar .day{font-weight:800; color:var(--acc); white-space:nowrap}
  .skill{
    display:flex; align-items:center; gap:6px; background:var(--panel);
    border:1px solid var(--line); border-radius:999px; padding:3px 10px 3px 12px; white-space:nowrap;
  }
  .skill b{color:#fff}
  .xpbar{width:56px; height:7px; background:#0a1122; border-radius:99px; overflow:hidden}
  .xpbar i{display:block; height:100%; background:var(--acc); width:0%}
  #desk{flex:1; position:relative; padding:18px}
  .icons{display:flex; flex-direction:column; gap:20px; width:92px}
  .icon{
    display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer;
    color:#fff; font-size:12.5px; font-weight:700; text-shadow:0 1px 3px rgba(0,0,0,.7); text-align:center;
  }
  .icon .tile{
    width:56px; height:56px; border-radius:13px; display:flex; align-items:center; justify-content:center;
    font-size:27px; background:linear-gradient(160deg,#f4f7ff,#c3d2ee); border:2px solid rgba(255,255,255,.65);
    box-shadow:0 6px 14px rgba(0,0,0,.35); position:relative; text-shadow:none;
  }
  .icon.locked{opacity:.45; cursor:default}
  .icon .badge{
    position:absolute; top:-7px; right:-7px; min-width:21px; height:21px; padding:0 5px;
    background:#e8452c; color:#fff; border-radius:99px; font-size:12px; font-weight:800;
    display:flex; align-items:center; justify-content:center; border:2px solid #fff;
  }
  .icon.pulse .tile{animation:pl 1.1s ease-in-out infinite}
  @keyframes pl{0%,100%{box-shadow:0 0 0 0 rgba(255,217,74,.0)}50%{box-shadow:0 0 0 9px rgba(255,217,74,.35)}}
  #deskHint{
    position:absolute; left:50%; bottom:22px; transform:translateX(-50%);
    background:rgba(10,17,34,.85); border:1px solid var(--line); color:var(--sub);
    padding:9px 16px; border-radius:999px; font-size:13.5px; white-space:nowrap;
  }

  /* ---------- windows ---------- */
  .win{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:min(94vw,760px); max-height:92vh; overflow:auto;
    background:var(--win); color:var(--wintx); border-radius:12px;
    box-shadow:0 24px 60px rgba(0,0,0,.55); display:none; flex-direction:column;
  }
  .win.on{display:flex}
  .winbar{
    display:flex; align-items:center; gap:8px; padding:10px 14px;
    background:linear-gradient(180deg,#33507f,#27436e); color:#fff; font-weight:800; font-size:15px;
    border-radius:12px 12px 0 0; position:sticky; top:0; z-index:2;
  }
  .winbar .x{
    margin-left:auto; width:30px; height:30px; border-radius:8px; border:0; cursor:pointer;
    background:rgba(255,255,255,.16); color:#fff; font-size:16px; font-weight:800;
  }
  .winbody{padding:16px}
  .mailfrom{font-size:13px; color:#5a6a86; margin-bottom:8px}
  .mailtext{font-size:15px; line-height:1.75; white-space:pre-wrap}
  .winbody .btn{margin-top:14px; background:#2c4a8a; border-color:#27436e; color:#fff}
  .winbody .btn.ghost{background:#eef2fa; color:#5a6a86; border-color:#b9c6de}

  /* ---------- tool window ---------- */
  #toolWin{width:min(96vw,820px)}
  .toolwrap{display:flex; gap:14px; flex-wrap:wrap}
  .canvasBox{flex:0 0 auto}
  canvas#cv{
    width:min(88vw,480px); height:auto; aspect-ratio:3/2; display:block;
    background:#888; border:2px solid #27436e; border-radius:6px; touch-action:none;
  }
  .sidecol{flex:1 1 230px; min-width:220px; display:flex; flex-direction:column; gap:10px}
  .brief{
    background:#fff; border:2px solid #b9c6de; border-radius:10px; padding:11px 13px;
    font-size:14px; line-height:1.7; min-height:118px; white-space:pre-wrap;
  }
  .brief b{color:#27436e}
  .cmdbox{display:flex; flex-direction:column; gap:8px}
  .cmdbox .btn{background:#22335c; border-color:#3d5a99; color:#fff; padding:11px 14px; font-size:15px}
  .cmdbox .btn.armed{background:#8a6d1f; border-color:var(--acc)}
  .swatches{display:none; gap:10px}
  .swatches.on{display:flex}
  .sw{
    flex:1; height:52px; border-radius:10px; border:3px solid #fff; cursor:pointer;
    box-shadow:0 0 0 2px #9db1d4; position:relative;
  }
  .sw span{
    position:absolute; left:0; right:0; bottom:-21px; text-align:center; font-size:12px; color:#33415c; font-weight:700;
  }
  .resultBox{
    display:none; background:#fff8d9; border:2px solid var(--acc); border-radius:10px;
    padding:12px 14px; font-size:14.5px; line-height:1.8; white-space:pre-wrap;
  }
  .resultBox.on{display:block}
  .lvup{color:#b8860b; font-weight:800}
  @media (max-width:560px){ .brief{min-height:0} }
</style>
</head>
<body>

<!-- ================= title ================= -->
<section id="title" class="screen on">
  <img class="logo" src="assets/logo-world-enhancer.jpg" alt="World Enhancer — Learn the Tools, Enhance the World">
  <div class="titleBtns">
    <button class="btn primary center" id="btnStart">はじめる</button>
    <button class="btn center" id="btnContinue" style="display:none">つづきから</button>
  </div>
  <div class="ver">World Enhancer v0.1</div>
</section>

<!-- ================= game (desktop) ================= -->
<section id="game" class="screen">
  <div id="statusbar">
    <span class="day">1日目・午前</span>
    <span class="skill">きりとる <b id="skKirLv">Lv1</b><span class="xpbar"><i id="skKirXp"></i></span></span>
    <span class="skill">ぬる <b id="skNurLv">Lv1</b><span class="xpbar"><i id="skNurXp"></i></span></span>
  </div>
  <div id="desk">
    <div class="icons">
      <div class="icon" id="icoMail"><div class="tile">✉️<span class="badge" id="mailBadge">1</span></div>メール</div>
      <div class="icon" id="icoTool"><div class="tile">🖌️</div>フォトショ</div>
      <div class="icon locked"><div class="tile">🔷</div>？？？</div>
      <div class="icon locked"><div class="tile">🧊</div>？？？</div>
    </div>
    <div id="deskHint">メールが届いています。開いてみましょう。</div>

    <!-- mail window -->
    <div class="win" id="mailWin">
      <div class="winbar">✉️ メール<button class="x" data-close="mailWin">×</button></div>
      <div class="winbody">
        <div class="mailfrom">差出人：先輩（制作チーム）</div>
        <div class="mailtext" id="mailText"></div>
        <button class="btn" id="btnAccept">この仕事を受ける</button>
        <button class="btn ghost" id="btnMailClose">閉じる</button>
      </div>
    </div>

    <!-- tool window -->
    <div class="win" id="toolWin">
      <div class="winbar">🖌️ フォトショ<button class="x" data-close="toolWin">×</button></div>
      <div class="winbody">
        <div class="toolwrap">
          <div class="canvasBox"><canvas id="cv" width="480" height="320"></canvas></div>
          <div class="sidecol">
            <div class="brief" id="brief"></div>
            <div class="swatches" id="swatches">
              <div class="sw" data-c="#f5f0e6" style="background:#f5f0e6"><span>しろ</span></div>
              <div class="sw" data-c="#aee3f5" style="background:#aee3f5"><span>みずいろ</span></div>
              <div class="sw" data-c="#f7c9d4" style="background:#f7c9d4"><span>ももいろ</span></div>
            </div>
            <div class="cmdbox">
              <button class="btn" id="cmdCut">きりとる</button>
              <button class="btn" id="cmdFill">ぬる</button>
              <button class="btn" id="cmdExport">かきだす</button>
              <button class="btn" id="cmdBack">もどる</button>
            </div>
            <div class="resultBox" id="resultBox"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
"use strict";
/* ================= data ================= */
var SAVE_KEY = "worldenhancer-save-v1";
var TGT = {x:298, y:138, w:88, h:128}; /* 切り抜き対象（星のランタン）の外接矩形 */
var FILL_OK = "#aee3f5"; /* 指示色：みずいろ */

function freshState(){
return { skills:{ kiritoru:{xp:0}, nuru:{xp:0}}, quest:"none"};
}
var S = freshState();
try{
var raw = localStorage.getItem(SAVE_KEY);
if(raw){ var p = JSON.parse(raw); if(p && p.skills && p.quest) S = p;}
}catch(e){}
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S));}catch(e){}}
function hasSave(){ try{ return!!localStorage.getItem(SAVE_KEY);}catch(e){ return false;}}

/* レベル： Lv→Lv+1 に要る経験値は Lv*15（累積） */
function lvFromXp(xp){
var lv = 1, need = 15, acc = 0;
while(xp >= acc + need){ acc += need; lv++; need = lv * 15;}
return { lv:lv, into: xp - acc, need: need};
}

/* ================= scoring (pure) ================= */
function scoreSelection(sel, tgt){
var ix = Math.max(0, Math.min(sel.x + sel.w, tgt.x + tgt.w) - Math.max(sel.x, tgt.x));
var iy = Math.max(0, Math.min(sel.y + sel.h, tgt.y + tgt.h) - Math.max(sel.y, tgt.y));
var inter = ix * iy;
var union = sel.w * sel.h + tgt.w * tgt.h - inter;
return { iou: union > 0? inter / union: 0, cover: inter / (tgt.w * tgt.h)};
}
function rankFromIou(iou){ return iou >= 0.72? "S": (iou >= 0.58? "A": "B");}

/* ================= dom ================= */
function $(id){ return document.getElementById(id);}
var cv = $("cv"), ctx = cv.getContext("2d");

function refreshStatus(){
var k = lvFromXp(S.skills.kiritoru.xp), n = lvFromXp(S.skills.nuru.xp);
$("skKirLv").textContent = "Lv" + k.lv;
$("skNurLv").textContent = "Lv" + n.lv;
$("skKirXp").style.width = Math.round(100 * k.into / k.need) + "%";
$("skNurXp").style.width = Math.round(100 * n.into / n.need) + "%";
$("mailBadge").style.display = (S.quest === "none")? "flex": "none";
$("icoTool").classList.toggle("pulse", S.quest === "accepted" && tool.step === "idle");
$("deskHint").textContent =
S.quest === "none"? "メールが届いています。開いてみましょう。":
S.quest === "accepted"? "フォトショを開いて、仕事を進めましょう。":
"最初の仕事は納品済み。次の仕事は準備中です（v0.2で追加）。";
}

/* ================= photo (procedural) ================= */
var photo = document.createElement("canvas"); photo.width = 480; photo.height = 320;
(function drawPhoto(){
var c = photo.getContext("2d");
var sky = c.createLinearGradient(0,0,0,220);
sky.addColorStop(0,"#8ec9e8"); sky.addColorStop(1,"#dff3fb");
c.fillStyle = sky; c.fillRect(0,0,480,220);
c.fillStyle = "#fff7ae"; c.beginPath(); c.arc(52,46,20,0,7); c.fill();
c.fillStyle = "#b7dba8"; c.beginPath(); c.moveTo(0,220); c.quadraticCurveTo(120,150,260,220); c.fill();
c.fillStyle = "#8fc47e"; c.beginPath(); c.moveTo(180,220); c.quadraticCurveTo(360,140,480,220); c.fill();
c.fillStyle = "#79a95f"; c.fillRect(0,220,480,100);
c.fillStyle = "#6b9a52";
for(var i=0;i<70;i++){ var gx=(i*67)%480, gy=226+((i*41)%88); c.fillRect(gx,gy,3,7);}
/* 左の岩（対象外） */
c.fillStyle = "#9aa3ad"; c.beginPath(); c.moveTo(38,268); c.lineTo(74,224); c.lineTo(122,238); c.lineTo(128,268); c.closePath(); c.fill();
c.fillStyle = "#878f98"; c.beginPath(); c.moveTo(74,224); c.lineTo(122,238); c.lineTo(96,268); c.lineTo(60,268); c.closePath(); c.fill();
/* 花（対象外） */
var cols=["#ff8fb2","#ffd94a","#ffffff"];
for(var j=0;j<9;j++){ var fx=150+((j*37)%160), fy=252+((j*29)%52);
c.fillStyle=cols[j%3]; c.beginPath(); c.arc(fx,fy,4,0,7); c.fill();}
/* ===== 対象：星のランタン（TGT の内側に描く） ===== */
var x=TGT.x, y=TGT.y, w=TGT.w, h=TGT.h;
c.strokeStyle="#5b4326"; c.lineWidth=5;
c.beginPath(); c.arc(x+w/2, y+14, 15, Math.PI, 0); c.stroke();
c.fillStyle="#7a5a30"; c.fillRect(x+10, y+22, w-20, 10);
var grd=c.createLinearGradient(x,y+32,x,y+h-16);
grd.addColorStop(0,"rgba(190,235,255,0.95)"); grd.addColorStop(1,"rgba(120,190,235,0.95)");
c.fillStyle=grd;
c.beginPath();
if(c.roundRect) c.roundRect(x+8, y+32, w-16, h-48, 12); else c.rect(x+8, y+32, w-16, h-48);
c.fill();
c.strokeStyle="#5b4326"; c.lineWidth=4; c.stroke();
c.fillStyle="#ffcf3f";
var cx=x+w/2, cy=y+32+(h-48)/2, R=17;
c.beginPath();
for(var k=0;k<10;k++){ var a=-Math.PI/2 + k*Math.PI/5, r=(k%2===0)?R:R*0.45;
var px=cx+Math.cos(a)*r, py=cy+Math.sin(a)*r; if(k===0)c.moveTo(px,py); else c.lineTo(px,py);}
c.closePath(); c.fill();
c.fillStyle="#7a5a30"; c.fillRect(x+4, y+h-16, w-8, 10);
c.fillStyle="#5b4326"; c.fillRect(x+16, y+h-6, w-32, 6);
})();

function checker(){
ctx.fillStyle="#cfd6e4"; ctx.fillRect(0,0,480,320);
ctx.fillStyle="#eef1f7";
for(var yy=0;yy<320;yy+=16) for(var xx=0;xx<480;xx+=16)
if(((xx+yy)/16)%2===0) ctx.fillRect(xx,yy,16,16);
}
function drawScene(){ ctx.drawImage(photo,0,0);}
function drawCutout(bg){
if(bg){ ctx.fillStyle=bg; ctx.fillRect(0,0,480,320);} else checker();
ctx.save();
ctx.beginPath(); ctx.rect(tool.sel.x, tool.sel.y, tool.sel.w, tool.sel.h); ctx.clip();
ctx.drawImage(photo,0,0);
ctx.restore();
ctx.strokeStyle="#27436e"; ctx.lineWidth=2; ctx.setLineDash([7,5]);
ctx.strokeRect(tool.sel.x, tool.sel.y, tool.sel.w, tool.sel.h);
ctx.setLineDash([]);
}

/* ================= tool (quest) ================= */
var tool = { step:"idle", sel:null, iou:0, fillMiss:0, drag:null};
var BRIEF = {
none: "まだ仕事を受けていません。\n先にメールを開いて、先輩の仕事を受けましょう。",
cut: "コマンド「きりとる」を押してから、写真の上でドラッグして <b>星のランタン</b> を囲んでください。\n余白は少なく、はみ出しは厳禁。対象が全部入るように。",
fill: "切り抜けました。コマンド「ぬる」を押して、背景色を選んでください。\n指示：背景は <b>みずいろ</b> です。",
exp: "背景が塗れました。コマンド「かきだす」で納品してください。",
done: "この仕事は納品済みです。おつかれさまでした。\n次の仕事は準備中です（v0.2で追加）。"
};
function setBrief(html){ $("brief").innerHTML = html;}
function toolUI(){
var q = S.quest;
$("cmdCut").disabled =!(q==="accepted" && (tool.step==="cut" || tool.step==="idle"));
$("cmdFill").disabled =!(q==="accepted" && tool.step==="fill");
$("cmdExport").disabled =!(q==="accepted" && tool.step==="exp");
$("cmdCut").classList.toggle("armed", tool.step==="cut");
$("cmdFill").classList.toggle("armed", tool.step==="fill");
$("swatches").classList.toggle("on", q==="accepted" && tool.step==="fill" && tool.fillArmed);
if(q==="none"){ setBrief(BRIEF.none);}
else if(q==="done"){ setBrief(BRIEF.done);}
else if(tool.step==="fill") setBrief(BRIEF.fill);
else if(tool.step==="exp") setBrief(BRIEF.exp);
else setBrief(BRIEF.cut);
refreshStatus();
}
function openTool(){
$("toolWin").classList.add("on");
if(S.quest==="done" && tool.sel){ drawCutout(FILL_OK);}
else if(tool.step==="fill" || tool.step==="exp"){ drawCutout(tool.step==="exp"? FILL_OK: null);}
else drawScene();
toolUI();
}
function closeWins(){ $("mailWin").classList.remove("on"); $("toolWin").classList.remove("on");}

/* canvas selection */
function cvPos(ev){
var r = cv.getBoundingClientRect();
return { x:(ev.clientX - r.left) * 480 / r.width, y:(ev.clientY - r.top) * 320 / r.height};
}
cv.addEventListener("pointerdown", function(ev){
if(!(S.quest==="accepted" && tool.step==="cut")) return;
tool.drag = cvPos(ev); cv.setPointerCapture(ev.pointerId);
});
cv.addEventListener("pointermove", function(ev){
if(!tool.drag) return;
var p = cvPos(ev);
var s = normSel(tool.drag, p);
drawScene();
ctx.strokeStyle="#fff"; ctx.lineWidth=2; ctx.setLineDash([7,5]); ctx.strokeRect(s.x,s.y,s.w,s.h); ctx.setLineDash([]);
});
cv.addEventListener("pointerup", function(ev){
if(!tool.drag) return;
var s = normSel(tool.drag, cvPos(ev)); tool.drag = null;
if(s.w < 12 || s.h < 12){ drawScene(); return;}
var sc = scoreSelection(s, TGT);
if(sc.cover >= 0.85 && sc.iou >= 0.45){
tool.sel = s; tool.iou = sc.iou; tool.step = "fill"; tool.fillArmed = false;
drawCutout(null); toolUI();
}else{
var why = sc.cover < 0.85? "ランタンが全部入っていません。もう少し大きく囲んで。":
"余白が大きすぎます。ランタンに寄せて囲んで。";
setBrief("" + why + "\n\n" + BRIEF.cut);
drawScene();
}
});
function normSel(a,b){
return { x:Math.min(a.x,b.x), y:Math.min(a.y,b.y), w:Math.abs(a.x-b.x), h:Math.abs(a.y-b.y)};
}

/* commands */
$("cmdCut").addEventListener("click", function(){
tool.step = "cut"; drawScene(); toolUI();
});
$("cmdFill").addEventListener("click", function(){
tool.fillArmed = true; toolUI();
});
$("swatches").addEventListener("click", function(ev){
var el = ev.target.closest(".sw"); if(!el || tool.step!=="fill") return;
if(el.dataset.c === FILL_OK){
tool.step = "exp"; drawCutout(FILL_OK); toolUI();
}else{
tool.fillMiss++;
setBrief("色が違います。指示は <b>みずいろ</b> です。メールや指示文はよく読むこと。\n\n" + BRIEF.fill);
}
});
$("cmdExport").addEventListener("click", function(){
var rank = rankFromIou(tool.iou);
var bonus = rank==="S"? 10: (rank==="A"? 6: 2);
var kBefore = lvFromXp(S.skills.kiritoru.xp).lv;
var nBefore = lvFromXp(S.skills.nuru.xp).lv;
var kGain = 12 + bonus, nGain = Math.max(4, 10 - tool.fillMiss * 2);
S.skills.kiritoru.xp += kGain;
S.skills.nuru.xp += nGain;
S.quest = "done"; save();
var kAfter = lvFromXp(S.skills.kiritoru.xp).lv;
var nAfter = lvFromXp(S.skills.nuru.xp).lv;
var msg = "納品完了！ 判定ランク " + rank + "（囲み方の一致度 " + Math.round(tool.iou*100) + "%）\n" +
"きりとる +" + kGain + " 経験値" + (kAfter>kBefore? "　<span class='lvup'>きりとる Lv" + kAfter + " に上がった！</span>": "") + "\n" +
"ぬる +" + nGain + " 経験値" + (nAfter>nBefore? "　<span class='lvup'>ぬる Lv" + nAfter + " に上がった！</span>": "") + "\n" +
"初めてにしては上出来。段取りが分かったね。";
$("resultBox").innerHTML = msg; $("resultBox").classList.add("on");
tool.step = "idle"; toolUI(); setBrief(BRIEF.done);
});
$("cmdBack").addEventListener("click", closeWins);

/* ================= mail / desktop ================= */
var MAIL_NEW =
"おはよう。今日から制作チームの新人として来てもらったね。\n" +
"最初は小さな仕事から。段取りを覚えていこう。\n\n" +
"商品写真の切り抜き\n" +
"・フォトショで写真を開く\n" +
"・星のランタンを きりとる（余白は少なく、全部入れる）\n" +
"・背景を みずいろ に ぬる\n" +
"・かきだす で納品\n\n" +
"分からなくなったら、ツール側の指示文を見れば大丈夫。よろしく。";
var MAIL_DONE =
"納品を確認したよ。おつかれさま。\n" +
"「段取りを覚える」のが最初の仕事。次はもう少し大きな作業を頼むね。\n\n" +
"（次の仕事は準備中です。v0.2で追加されます）";
$("icoMail").addEventListener("click", function(){
closeWins();
$("mailText").textContent = (S.quest === "done")? MAIL_DONE: MAIL_NEW;
$("btnAccept").style.display = (S.quest === "none")? "block": "none";
$("mailWin").classList.add("on");
});
$("btnAccept").addEventListener("click", function(){
S.quest = "accepted"; save(); closeWins();
tool.step = "idle"; refreshStatus(); openTool();
});
$("btnMailClose").addEventListener("click", closeWins);
$("icoTool").addEventListener("click", openTool);
document.querySelectorAll("[data-close]").forEach(function(b){
b.addEventListener("click", closeWins);
});

/* ================= title ================= */
function enterGame(fresh){
if(fresh){ var f = freshState(); S.skills = f.skills; S.quest = f.quest;
tool.step = "idle"; tool.sel = null; tool.iou = 0; tool.fillMiss = 0; tool.drag = null; tool.fillArmed = false;
$("resultBox").classList.remove("on"); save(); }
$("title").classList.remove("on"); $("game").classList.add("on");
drawScene(); refreshStatus();
}
$("btnStart").addEventListener("click", function(){ enterGame(true);});
$("btnContinue").addEventListener("click", function(){ enterGame(false);});
if(hasSave()) $("btnContinue").style.display = "block";
refreshStatus();

/* test hook */
window.__we = { state:S, tool:tool, scoreSelection:scoreSelection, rankFromIou:rankFromIou,
lvFromXp:lvFromXp, TGT:TGT, enterGame:enterGame};
</script>
</body>
