<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>World Enhancer — Learn the Tools, Enhance the World</title>
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
<style>
  :root{
    --ink:#0d1526; --navy:#101c38; --panel:#1a2748; --panel2:#22335c;
    --line:#3d5a99; --txt:#eef2ff; --sub:#a9bce0; --acc:#ffd94a; --good:#7ee2a0;
    --win:#dfe6f2; --wintx:#1c2436;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    background:var(--ink); color:var(--txt); overflow:hidden;
    user-select:none; -webkit-user-select:none;
  }
  .screen{position:fixed; inset:0; display:none; flex-direction:column}
  .screen.on{display:flex}

  /* ---------- title ---------- */
  #title{
    align-items:center; justify-content:center; gap:22px; padding:24px;
    background:
      linear-gradient(rgba(80,130,255,.10) 1px, transparent 1px),
      linear-gradient(90deg, rgba(80,130,255,.10) 1px, transparent 1px),
      radial-gradient(120% 90% at 50% 0%, #1b2c55 0%, var(--ink) 70%);
    background-size:36px 36px, 36px 36px, 100% 100%;
  }
  #title img.logo{
    width:min(78vw,430px); border-radius:14px;
    box-shadow:0 0 0 3px #ece6d6, 0 0 0 6px #2a3c66, 0 18px 50px rgba(0,0,0,.55);
  }
  .titleBtns{display:flex; flex-direction:column; gap:10px; width:min(78vw,300px)}
  .ver{position:absolute; right:14px; bottom:12px; color:var(--sub); font-size:12px}

  /* ---------- buttons (uniform, full width, left aligned) ---------- */
  .btn{
    display:block; width:100%; padding:13px 16px; text-align:left;
    font-size:16px; font-weight:700; color:var(--txt); white-space:nowrap;
    background:var(--panel2); border:2px solid var(--line); border-radius:10px; cursor:pointer;
  }
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:#2c4a8a; border-color:#6f97e8}
  .btn:disabled{opacity:.38; cursor:default}
  .btn.center{text-align:center}

  /* ---------- desktop ---------- */
  #game{background:linear-gradient(160deg,#274b73 0%,#1d3a5f 45%,#2c5d50 130%)}
  #statusbar{
    display:flex; align-items:center; gap:10px; padding:8px 12px;
    background:rgba(10,17,34,.92); border-bottom:2px solid var(--line);
    font-size:13px; flex-wrap:wrap;
  }
  #statusbar .day{font-weight:800; color:var(--acc); white-space:nowrap}
  #skills{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  .skill{
    display:flex; align-items:center; gap:6px; background:var(--panel);
    border:1px solid var(--line); border-radius:999px; padding:3px 10px 3px 12px; white-space:nowrap;
  }
  .skill b{color:#fff}
  .xpbar{width:48px; height:7px; background:#0a1122; border-radius:99px; overflow:hidden}
  .xpbar i{display:block; height:100%; background:var(--acc); width:0%}
  #desk{flex:1; position:relative; padding:18px}
  .icons{display:flex; flex-direction:column; gap:20px; width:92px}
  .icon{
    display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer;
    color:#fff; font-size:12.5px; font-weight:700; text-shadow:0 1px 3px rgba(0,0,0,.7); text-align:center;
  }
  .icon .tile{
    width:56px; height:56px; border-radius:13px; display:flex; align-items:center; justify-content:center;
    font-size:27px; background:linear-gradient(160deg,#f4f7ff,#c3d2ee); border:2px solid rgba(255,255,255,.65);
    box-shadow:0 6px 14px rgba(0,0,0,.35); position:relative; text-shadow:none;
  }
  .icon.locked{opacity:.45; cursor:default}
  .icon .badge{
    position:absolute; top:-7px; right:-7px; min-width:21px; height:21px; padding:0 5px;
    background:#e8452c; color:#fff; border-radius:99px; font-size:12px; font-weight:800;
    display:flex; align-items:center; justify-content:center; border:2px solid #fff;
  }
  .icon.pulse .tile{animation:pl 1.1s ease-in-out infinite}
  @keyframes pl{0%,100%{box-shadow:0 0 0 0 rgba(255,217,74,.0)}50%{box-shadow:0 0 0 9px rgba(255,217,74,.35)}}
  #deskHint{
    position:absolute; left:50%; bottom:22px; transform:translateX(-50%);
    background:rgba(10,17,34,.85); border:1px solid var(--line); color:var(--sub);
    padding:9px 16px; border-radius:999px; font-size:13.5px; white-space:nowrap;
  }

  /* ---------- windows ---------- */
  .win{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:min(94vw,760px); max-height:92vh; overflow:auto;
    background:var(--win); color:var(--wintx); border-radius:12px;
    box-shadow:0 24px 60px rgba(0,0,0,.55); display:none; flex-direction:column;
  }
  .win.on{display:flex}
  .winbar{
    display:flex; align-items:center; gap:8px; padding:10px 14px;
    background:linear-gradient(180deg,#33507f,#27436e); color:#fff; font-weight:800; font-size:15px;
    border-radius:12px 12px 0 0; position:sticky; top:0; z-index:2;
  }
  .winbar .x{
    margin-left:auto; width:30px; height:30px; border-radius:8px; border:0; cursor:pointer;
    background:rgba(255,255,255,.16); color:#fff; font-size:16px; font-weight:800;
  }
  .winbody{padding:16px}
  .mailfrom{font-size:13px; color:#5a6a86; margin-bottom:8px}
  .mailtext{font-size:15px; line-height:1.75; white-space:pre-wrap}
  .winbody .btn{margin-top:14px; background:#2c4a8a; border-color:#27436e; color:#fff}
  .winbody .btn.ghost{background:#eef2fa; color:#5a6a86; border-color:#b9c6de}

  /* ---------- tool window ---------- */
  #toolWin{width:min(96vw,820px)}
  .toolwrap{display:flex; gap:14px; flex-wrap:wrap}
  .canvasBox{flex:0 0 auto}
  canvas#cv{
    width:min(88vw,480px); height:auto; aspect-ratio:3/2; display:block;
    background:#888; border:2px solid #27436e; border-radius:6px; touch-action:none;
  }
  .sidecol{flex:1 1 230px; min-width:220px; display:flex; flex-direction:column; gap:10px}
  .brief{
    background:#fff; border:2px solid #b9c6de; border-radius:10px; padding:11px 13px;
    font-size:14px; line-height:1.7; min-height:118px; white-space:pre-wrap;
  }
  .brief b{color:#27436e}
  .cmdbox{display:flex; flex-direction:column; gap:8px}
  .cmdbox .btn{background:#22335c; border-color:#3d5a99; color:#fff; padding:11px 14px; font-size:15px}
  .cmdbox .btn.armed{background:#8a6d1f; border-color:var(--acc)}
  .swatches{display:none; gap:10px; margin-bottom:12px}
  .swatches.on{display:flex}
  .sw{
    flex:1; height:52px; border-radius:10px; border:3px solid #fff; cursor:pointer;
    box-shadow:0 0 0 2px #9db1d4; position:relative;
  }
  .sw span{
    position:absolute; left:0; right:0; bottom:-21px; text-align:center; font-size:12px; color:#33415c; font-weight:700;
  }
  .copies{display:none; flex-direction:column; gap:8px}
  .copies.on{display:flex}
  .adjbox{display:none; flex-direction:column; gap:9px; background:#fff; border:2px solid #b9c6de; border-radius:10px; padding:11px 13px}
  .adjbox.on{display:flex}
  .adjbox label{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; color:#33415c; white-space:nowrap}
  .adjbox input[type=range]{flex:1}
  .adjnote{font-size:12px; color:#5a6a86; line-height:1.6}
  .copies .btn{background:#fff; color:#22335c; border-color:#b9c6de; padding:11px 14px; font-size:14px; white-space:normal}
  .resultBox{
    display:none; background:#fff8d9; border:2px solid var(--acc); border-radius:10px;
    padding:12px 14px; font-size:14.5px; line-height:1.8; white-space:pre-wrap;
  }
  .resultBox.on{display:block}
  .lvup{color:#b8860b; font-weight:800}
  @media (max-width:560px){ .brief{min-height:0} }
</style>
</head>
<body>

<!-- ================= title ================= -->
<section id="title" class="screen on">
  <img class="logo" src="assets/logo-world-enhancer.jpg" alt="World Enhancer — Learn the Tools, Enhance the World">
  <div class="titleBtns">

    <button class="btn center" id="btnContinue" style="display:none">つづきから</button>

  <div class="ver">World Enhancer v0.8</div>
</section>

<!-- ================= game (desktop) ================= -->
<section id="game" class="screen">
  <div id="statusbar">
    <span class="day" id="dayLabel">1日目・午前</span>
    <span class="day" id="rankLabel">称号：みならい</span>

  </div>
  <div id="desk">
    <div class="icons">
      <div class="icon" id="icoMail"><div class="tile">✉️<span class="badge" id="mailBadge">1</span></div>メール</div>
      <div class="icon" id="icoTool"><div class="tile">🖌️</div>フォトショ</div>
      <div class="icon locked" id="icoIrare"><div class="tile" id="irareTile">🔷</div><span id="irareLabel">？？？</span></div>
      <div class="icon locked" id="icoPoser"><div class="tile">🧊</div><span id="poserLabel">？？？</span></div>
      <div class="icon locked" id="icoUnity"><div class="tile" id="unityTile">🔶</div><span id="unityLabel">？？？</span></div>

    </div>

    <!-- mail window -->
    <div class="win" id="mailWin">

      <div class="winbody">
        <div class="mailfrom" id="mailFrom">差出人：先輩（制作チーム）</div>
        <div class="mailtext" id="mailText"></div>
        <button class="btn" id="btnAccept">この仕事を受ける</button>
        <button class="btn ghost" id="btnMailClose">閉じる</button>

    <!-- tool window -->
    <div class="win" id="toolWin">
      <div class="winbar"><span id="toolTitle">🖌️ フォトショ</span><button class="x" data-close="toolWin">×</button></div>
      <div class="winbody">
        <div class="toolwrap">
          <div class="canvasBox"><canvas id="cv" width="480" height="320"></canvas></div>
          <div class="sidecol">
            <div class="brief" id="brief"></div>
            <div class="swatches" id="swatches">
              <div class="sw" data-c="#f5f0e6" style="background:#f5f0e6"><span>しろ</span></div>
              <div class="sw" data-c="#aee3f5" style="background:#aee3f5"><span>みずいろ</span></div>
              <div class="sw" data-c="#f7c9d4" style="background:#f7c9d4"><span>ももいろ</span></div>
            </div>
            <div class="copies" id="copies"></div>
            <div class="adjbox" id="adjbox">
              <label>あかるさ <input type="range" id="adjB" min="60" max="150" value="100"></label>
              <label>いろあい <input type="range" id="adjH" min="-60" max="60" value="0"></label>
              <div class="adjnote" id="adjNote">見本：昼の明るい光で撮ったような、品物の色がそのまま出ている感じに。</div>
            </div>
            <div class="cmdbox" id="cmdbox"></div>
            <div class="resultBox" id="resultBox"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
"use strict";
/* ================= skills / state ================= */
var SAVE_KEY = "worldenhancer-save-v1";
var SKILLS = [
{ id:"kiritoru", label:"きりとる"},
{ id:"nuru", label:"ぬる"},
{ id:"kesu", label:"けす"},
{ id:"kasaneru", label:"かさねる"},
{ id:"mojiire", label:"もじをいれる"},
{ id:"naosu", label:"なおす"},
{ id:"bokasu", label:"ぼかす"},
{ id:"ironokosu", label:"いろをのこす"},
{ id:"kaku", label:"かく"},
{ id:"naraberu", label:"ならべる"},
{ id:"awaseru", label:"あわせる"},
{ id:"tsukuru", label:"つくる"},
{ id:"mawasu", label:"まわす"},
{ id:"hikari", label:"ひかり"},
{ id:"oku", label:"おく"},
{ id:"tsunagu", label:"つなぐ"},
{ id:"ugokasu", label:"うごかす"},
{ id:"makaseru", label:"まかせる"}
];
var TITLES = [
{ xp:0, label:"みならい" },
{ xp:50, label:"コーダー" },
{ xp:110, label:"アプリデザイナー" },
{ xp:170, label:"レンダラー" },
{ xp:230, label:"デザイナー" },
{ xp:300, label:"モデラー" },
{ xp:385, label:"ワールドエンハンサー" }
];
function totalXp(){ var t = 0; SKILLS.forEach(function(k){ t += S.skills[k.id].xp; }); return t; }
function titleFor(xp){ var cur = TITLES[0]; TITLES.forEach(function(t){ if(xp >= t.xp) cur = t; }); return cur.label; }
function freshState(){
var s = { skills:{}, progress:0, accepted:false};
SKILLS.forEach(function(k){ s.skills[k.id] = { xp:0};});
return s;
}
function migrate(p){
var s = freshState();
if(!p) return s;
if(p.skills) SKILLS.forEach(function(k){ if(p.skills[k.id]) s.skills[k.id].xp = p.skills[k.id].xp | 0;});
if(typeof p.progress === "number"){ s.progress = p.progress; s.accepted = !!p.accepted; }
else if(p.quest === "done"){ s.progress = 1; s.accepted = false;}
else if(p.quest === "accepted"){ s.progress = 0; s.accepted = true;}
return s;
}
var S = freshState();
try{
var raw = localStorage.getItem(SAVE_KEY);
if(raw) S = migrate(JSON.parse(raw));
}catch(e){}
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S));}catch(e){}}
function hasSave(){ try{ return!!localStorage.getItem(SAVE_KEY);}catch(e){ return false;}}

/* レベル： Lv→Lv+1 に要る経験値は Lv*15（累積） */
function lvFromXp(xp){
var lv = 1, need = 15, acc = 0;
while(xp >= acc + need){ acc += need; lv++; need = lv * 15;}
return { lv:lv, into:xp - acc, need:need};
}

/* ================= judging helpers (pure) ================= */
function scoreSelection(sel, tgt){
var ix = Math.max(0, Math.min(sel.x + sel.w, tgt.x + tgt.w) - Math.max(sel.x, tgt.x));
var iy = Math.max(0, Math.min(sel.y + sel.h, tgt.y + tgt.h) - Math.max(sel.y, tgt.y));
var inter = ix * iy;
var union = sel.w * sel.h + tgt.w * tgt.h - inter;
return { iou: union > 0? inter / union: 0, cover: inter / (tgt.w * tgt.h)};
}
function rankFromIou(iou){ return iou >= 0.72? "S": (iou >= 0.58? "A": "B");}
function judgeAdjust(b, h, tb, th){ /* 補正スライダーと目標の近さ → 合否と 0..1 の精度 */
var db = Math.abs(b - tb) / 40, dh = Math.abs(h - th) / 45;
return { ok: db <= 0.35 && dh <= 0.35, score: Math.max(0, 1 - (db + dh) / 2) };
}
function judgePlace(dx, dy){ /* 台の中心からのずれ → 0..1 の精度と合否 */
var d = Math.sqrt(dx * dx + dy * dy);
return { dist:d, ok: Math.abs(dx) <= 48 && Math.abs(dy) <= 32, score: Math.max(0, 1 - d / 90)};
}
function hitFlaw(flaws, erased, x, y){
for(var i = 0; i < flaws.length; i++){
if(erased[i]) continue;
var f = flaws[i], dx = x - f.x, dy = y - f.y;
if(dx * dx + dy * dy <= (f.r + 7) * (f.r + 7)) return i;
}
return -1;
}

/* ================= photos (offscreen 480x320, placeholder → real) ================= */
function makePhoto(src, painter){
var c = document.createElement("canvas"); c.width = 480; c.height = 320;
painter(c.getContext("2d"));
var rec = { canvas:c, ready:false};
if(src){
var im = new Image();
im.onload = function(){
c.getContext("2d").drawImage(im, 0, 0, 480, 320);
rec.ready = true;
if(typeof blurCache !== "undefined") blurCache = {};
if(typeof buildSprite === "function" && rec === PH.q1) buildSprite();
if(document.getElementById("game").classList.contains("on")) refreshCanvas();
};
im.src = src;
}
return rec;
}
function paintMeadow(c){ /* q1 placeholder: v0.1 の手続き描画 */
var sky = c.createLinearGradient(0,0,0,220);
sky.addColorStop(0,"#8ec9e8"); sky.addColorStop(1,"#dff3fb");
c.fillStyle = sky; c.fillRect(0,0,480,220);
c.fillStyle = "#fff7ae"; c.beginPath(); c.arc(52,46,20,0,7); c.fill();
c.fillStyle = "#b7dba8"; c.beginPath(); c.moveTo(0,220); c.quadraticCurveTo(120,150,260,220); c.fill();
c.fillStyle = "#8fc47e"; c.beginPath(); c.moveTo(180,220); c.quadraticCurveTo(360,140,480,220); c.fill();
c.fillStyle = "#79a95f"; c.fillRect(0,220,480,100);
c.fillStyle = "#9aa3ad"; c.beginPath(); c.moveTo(38,268); c.lineTo(74,224); c.lineTo(122,238); c.lineTo(128,268); c.closePath(); c.fill();
var x = 266, y = 63, w = 123, h = 218;
c.strokeStyle = "#5b4326"; c.lineWidth = 6;
c.beginPath(); c.arc(x + w/2, y + 22, 24, Math.PI, 0); c.stroke();
c.fillStyle = "#7a5a30"; c.fillRect(x + 16, y + 34, w - 32, 16);
var grd = c.createLinearGradient(x, y + 50, x, y + h - 24);
grd.addColorStop(0, "rgba(190,235,255,0.95)"); grd.addColorStop(1, "rgba(120,190,235,0.95)");
c.fillStyle = grd; c.fillRect(x + 12, y + 50, w - 24, h - 74);
c.strokeStyle = "#5b4326"; c.lineWidth = 5; c.strokeRect(x + 12, y + 50, w - 24, h - 74);
c.fillStyle = "#ffcf3f";
var cx = x + w/2, cy = y + 50 + (h - 74)/2, R = 26;
c.beginPath();
for(var k = 0; k < 10; k++){ var a = -Math.PI/2 + k * Math.PI/5, r = (k % 2 === 0)? R: R * 0.45;
var px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r; if(k === 0) c.moveTo(px, py); else c.lineTo(px, py);}
c.closePath(); c.fill();
c.fillStyle = "#7a5a30"; c.fillRect(x + 6, y + h - 24, w - 12, 14);
}
function paintShop(c){ /* q2 placeholder */
c.fillStyle = "#aee0f5"; c.fillRect(0,0,480,110);
c.fillStyle = "#f3e6cf"; c.fillRect(0,110,480,160);
c.fillStyle = "#8a6d4a"; c.fillRect(0,96,480,16);
c.fillStyle = "#c9b18a"; c.fillRect(150,130,180,26);
c.fillStyle = "#7fb2d9"; c.fillRect(52,168,150,84);
c.strokeStyle = "#5b4326"; c.lineWidth = 5; c.strokeRect(52,168,150,84);
c.fillStyle = "#6b4a2f"; c.fillRect(330,168,74,102);
c.fillStyle = "#b9b0a4"; c.fillRect(0,270,480,50);
c.fillStyle = "#d96a8a"; c.fillRect(228,226,10,26); c.fillRect(252,226,10,26);
}
function paintSunset(c){ /* q3 placeholder */
var sky = c.createLinearGradient(0,0,0,190);
sky.addColorStop(0,"#ff9e5e"); sky.addColorStop(0.7,"#ffc98a"); sky.addColorStop(1,"#ffe3ae");

}
function paintBanner(c){ /* q4 placeholder */
c.fillStyle = "#f7efdd"; c.fillRect(0,0,480,320);
c.fillStyle = "#e8dcc2"; c.fillRect(0,238,480,82);
c.fillStyle = "#8ec9e8"; c.fillRect(318,74,44,74);
c.fillStyle = "#e88ab0"; c.fillRect(376,96,34,52);
c.fillStyle = "#7a5a30"; c.fillRect(300,196,150,12);
c.fillStyle = "#b08954"; c.fillRect(316,150,110,48);
c.fillStyle = "#5b8c5a"; c.beginPath(); c.arc(428,66,17,0,7); c.fill();
}
function paintShelf(c){ /* q5 placeholder */
c.fillStyle = "#d8c9a8"; c.fillRect(0,0,480,320);
c.fillStyle = "#8a6d4a"; c.fillRect(30,96,420,12); c.fillRect(30,196,420,12);
c.fillStyle = "#7fb069"; c.fillRect(70,44,30,52); c.fillRect(120,52,24,44);
c.fillStyle = "#d96a4a"; c.fillRect(180,40,34,56);
c.fillStyle = "#5e7fb8"; c.fillRect(250,48,28,48); c.fillRect(310,44,30,52);
c.fillStyle = "#b08954"; c.fillRect(370,56,64,40);
c.fillStyle = "#e88ab0"; c.fillRect(80,150,26,46); c.fillStyle = "#8ec9e8"; c.fillRect(140,144,30,52);
c.fillStyle = "#7a5a30"; c.fillRect(220,152,70,44); c.fillRect(330,148,26,48);
c.fillStyle = "#5b8c5a"; c.beginPath(); c.arc(410,140,20,0,7); c.fill();
}

function drawGroundGrid(cols, rows){

ctx.beginPath();
ctx.moveTo(c.x, topY - h); ctx.lineTo(c.x + w, topY); ctx.lineTo(c.x, topY + h); ctx.lineTo(c.x - w, topY);

function handleNodeClick(nd){
var q = stage.q;
if(!stage.linkFrom){ stage.linkFrom = nd.id; stage.note = ""; }
else if(stage.linkFrom === nd.id){ stage.linkFrom = null; stage.note = ""; }
else{
var a = stage.linkFrom, b = nd.id; stage.linkFrom = null;
var isPair = function(pr){ return (pr[0] === a && pr[1] === b) || (pr[0] === b && pr[1] === a); };
if(q.pairs.some(isPair) &&!stage.links.some(isPair)){
stage.links.push([a, b]);
if(stage.links.length >= q.pairs.length){
if(q.type === "build"){ stage.step = "move"; stage.note = "つながった。最後は うごかす。"; }

}else stage.note = "つながった。残り " + (q.pairs.length - stage.links.length) + " 本。";
}
else if(stage.links.some(isPair)){ stage.note = "そこはもうつながっている。"; }

var COMMANDS = {
cutfill:[["cut","きりとる"],["fill","ぬる"],["exp","かきだす"],["back","もどる"]],
erase:[["erase","けす"],["exp","かきだす"],["back","もどる"]],
place:[["place","かさねる"],["exp","かきだす"],["back","もどる"]],
banner:[["moji","もじをいれる"],["exp","かきだす"],["back","もどる"]],
adjust:[["naosu","なおす"],["exp","かきだす"],["back","もどる"]],
blur:[["blur","ぼかす"],["exp","かきだす"],["back","もどる"]],
spotcolor:[["spot","いろをのこす"],["exp","かきだす"],["back","もどる"]],
trim:[["trim","きりとる"],["moji","もじをいれる"],["exp","かきだす"],["back","もどる"]],
trace:[["kaku","かく"],["exp","かきだす"],["back","もどる"]],
align:[["naraberu","ならべる"],["exp","かきだす"],["back","もどる"]],
combine:[["awaseru","あわせる"],["exp","かきだす"],["back","もどる"]],
logo:[["kaku","かく"],["naraberu","ならべる"],["exp","かきだす"],["back","もどる"]],
model:[["tsukuru","つくる"],["exp","かきだす"],["back","もどる"]],
rotate:[["mawasu","まわす"],["exp","かきだす"],["back","もどる"]],
light:[["hikari","ひかり"],["exp","かきだす"],["back","もどる"]],
render:[["tsukuru","つくる"],["mawasu","まわす"],["hikari","ひかり"],["exp","かきだす"],["back","もどる"]],
scene:[["oku","おく"],["exp","かきだす"],["back","もどる"]],
connect:[["tsunagu","つなぐ"],["exp","かきだす"],["back","もどる"]],
move:[["ugokasu","うごかす"],["exp","かきだす"],["back","もどる"]],
build:[["oku","おく"],["tsunagu","つなぐ"],["ugokasu","うごかす"],["exp","かきだす"],["back","もどる"]],
aifix:[["makaseru","まかせる"],["exp","かきだす"],["back","もどる"]],
photoscene:[["oku","おく"],["exp","かきだす"],["back","もどる"]]
};
function setBrief(html){ $("brief").innerHTML = html;}
function updateUI(){
var q = curQuest();
var box = $("cmdbox"); box.innerHTML = "";
$("swatches").classList.remove("on");
$("copies").classList.remove("on");
$("adjbox").classList.remove("on");
if(!q){ setBrief("全ての仕事は納品済みです。おつかれさまでした。");
var bb2 = document.createElement("button");
bb2.className = "btn"; bb2.textContent = "もどる";
bb2.addEventListener("click", closeWins);
box.appendChild(bb2);
renderStatus(); return; }
if(!S.accepted ||!stage){
setBrief(stage && stage.finished ? "この仕事は納品済みです。メールに次の仕事が届いています。" :
"まだ仕事を受けていません。\n先にメールを開いて、先輩の仕事を受けましょう。");
var bb = document.createElement("button");
bb.className = "btn"; bb.textContent = "もどる";
bb.addEventListener("click", closeWins);
box.appendChild(bb);
renderStatus(); return;
}
var b = BRIEFS[q.id][stage.step] || BRIEFS[q.id].idle;
setBrief((stage.note? "" + stage.note + "\n\n": "") + b);
if(q.type === "cutfill" && stage.step === "fill" && stage.fillArmed) $("swatches").classList.add("on");
if(q.type === "adjust" && (stage.step === "adjust" || stage.step === "exp")) $("adjbox").classList.add("on");
var chipSig = "";
if(q.type === "banner" && stage.step === "copy") chipSig = "banner";
else if(q.type === "combine" && stage.step === "pick") chipSig = "combine:" + stage.pick.join(",");
else if(q.type === "logo" && stage.step === "color") chipSig = "logo";
else if((q.type === "scene" || q.type === "build" || q.type === "photoscene") && stage.step === "place") chipSig = "palette:" + (stage.selObj || "");
if(chipSig){
$("copies").classList.add("on");
if(chipSig!== updateUI._chipSig) renderChips();
}
updateUI._chipSig = chipSig;
COMMANDS[q.type].forEach(function(pair){
var id = pair[0], btn = document.createElement("button");
btn.className = "btn"; btn.textContent = pair[1]; btn.dataset.cmd = id;
var en = true, armed = false;
if(stage.finished && id!== "back") en = false;
else if(id === "cut"){ en = (stage.step === "idle" || stage.step === "cut"); armed = stage.step === "cut";}
else if(id === "fill"){ en = stage.step === "fill"; armed = stage.step === "fill";}
else if(id === "erase"){ en = (stage.step === "idle" || stage.step === "erase"); armed = stage.step === "erase";}
else if(id === "place"){ en = (stage.step === "idle" || stage.step === "place"); armed = stage.step === "place";}
else if(id === "moji"){ if(q.type === "trim"){ en = stage.step === "pos"; armed = stage.step === "pos";} else { en = (stage.step === "idle" || stage.step === "copy"); armed = stage.step === "copy";}}
else if(id === "naosu"){ en = (stage.step === "idle" || stage.step === "adjust"); armed = stage.step === "adjust";}
else if(id === "blur"){ en = (stage.step === "idle" || stage.step === "blur"); armed = stage.step === "blur";}
else if(id === "spot"){ en = (stage.step === "idle" || stage.step === "spot"); armed = stage.step === "spot";}
else if(id === "trim"){ en = (stage.step === "idle" || stage.step === "trim"); armed = stage.step === "trim";}
else if(id === "kaku"){ en = (stage.step === "idle" || stage.step === "trace"); armed = stage.step === "trace";}
else if(id === "naraberu"){ if(q.type === "logo"){ en = stage.step === "place"; armed = stage.step === "place";} else { en = (stage.step === "idle" || stage.step === "align"); armed = stage.step === "align";}}
else if(id === "awaseru"){ en = (stage.step === "idle" || stage.step === "pick"); armed = stage.step === "pick";}
else if(id === "tsukuru"){ if(q.type === "render"){ en = (stage.step === "idle" || stage.step === "place"); armed = stage.step === "place"; } else { en = (stage.step === "idle" || stage.step === "build"); armed = stage.step === "build"; } }
else if(id === "mawasu"){ if(q.type === "render"){ en = stage.step === "rot"; armed = stage.step === "rot"; } else { en = (stage.step === "idle" || stage.step === "rot"); armed = stage.step === "rot"; } }
else if(id === "hikari"){ if(q.type === "render"){ en = stage.step === "light"; armed = stage.step === "light"; } else { en = (stage.step === "idle" || stage.step === "light"); armed = stage.step === "light"; } }
else if(id === "oku"){ en = (stage.step === "idle" || stage.step === "place"); armed = stage.step === "place";}
else if(id === "tsunagu"){ if(q.type === "build"){ en = stage.step === "link"; armed = stage.step === "link"; } else { en = (stage.step === "idle" || stage.step === "link"); armed = stage.step === "link"; } }
else if(id === "ugokasu"){ if(q.type === "build"){ en = stage.step === "move"; armed = stage.step === "move"; } else { en = (stage.step === "idle" || stage.step === "path"); armed = stage.step === "path"; } }
else if(id === "makaseru"){ en = (stage.step === "idle" || stage.step === "fix"); armed = stage.step === "fix";}
else if(id === "exp"){ en = stage.step === "exp" || (q.type === "adjust" && stage.step === "adjust");}
btn.disabled =!en;
btn.classList.toggle("armed", armed);
btn.addEventListener("click", function(){ onCmd(id);});
box.appendChild(btn);
});
renderStatus();
}
function onCmd(id){
if(!stage) return;
var q = stage.q;
if(id === "back"){ closeWins(); return;}
if(id === "cut" && q.type === "cutfill"){ stage.step = "cut"; stage.note = ""; refreshCanvas();}
else if(id === "fill" && q.type === "cutfill"){ stage.fillArmed = true;}
else if(id === "erase" && q.type === "erase"){ stage.step = "erase"; stage.note = "";}
else if(id === "place" && q.type === "place"){ stage.step = "place"; stage.note = ""; refreshCanvas();}
else if(id === "moji" && q.type === "banner"){ stage.step = "copy"; stage.note = "";}
else if(id === "moji" && q.type === "trim"){ stage.note = "タイトルは空の部分に。写真の上で置く場所をクリック。";}
else if(id === "naosu" && q.type === "adjust"){ stage.step = "adjust"; stage.note = ""; syncSliders();}
else if(id === "blur" && q.type === "blur"){ stage.step = "blur"; stage.note = "";}
else if(id === "spot" && q.type === "spotcolor"){ stage.step = "spot"; stage.note = "";}
else if(id === "trim" && q.type === "trim"){ stage.step = "trim"; stage.note = ""; refreshCanvas();}
else if(id === "kaku" && (q.type === "trace" || q.type === "logo")){ stage.step = "trace"; stage.note = "";}
else if(id === "naraberu" && q.type === "align"){ stage.step = "align"; stage.note = "";}
else if(id === "naraberu" && q.type === "logo"){ stage.note = "点線の枠の中をクリックして、マークの場所を決めて。";}
else if(id === "awaseru" && q.type === "combine"){
if(stage.step === "idle"){ stage.step = "pick"; stage.note = ""; }
else if(stage.step === "pick"){
if(stage.pick.length!== 2){ stage.note = "図形を2つ選んでから押して。"; }
else if(q.answer.every(function(a){ return stage.pick.indexOf(a) >= 0; })){ stage.combined = true; stage.step = "exp"; stage.note = ""; }
else{ stage.combineMiss++; stage.pick = []; stage.note = "その組み合わせでは家にならない。屋根と壁、で考えて。"; }
}
refreshCanvas();
}
else if(id === "tsukuru" && q.type === "model"){
if(stage.step === "idle"){ stage.step = "build"; stage.note = ""; }
else if(stage.step === "build"){
var diff = 0;
for(var hi = 0; hi < q.target.length; hi++) if(stage.heights[hi]!== q.target[hi]) diff++;
if(diff === 0){ stage.step = "exp"; stage.note = "見本どおり。あとは納品だけ。"; }
else{ stage.buildMiss++; stage.note = "見本と違うセルが " + diff + " か所ある。高さの数字を見比べて。"; }
}
refreshCanvas();
}
else if(id === "tsukuru" && q.type === "render"){
if(stage.step === "idle"){ stage.step = "place"; stage.note = ""; }
else if(stage.step === "place"){
if(stage.placeCell === q.targetCell){ stage.step = "rot"; stage.note = "場所は決まった。次は向き。"; }
else{ stage.placeMiss++; stage.note = "置き場所が点線のマスと違う。"; }
}
refreshCanvas();
}
else if(id === "mawasu" && q.type === "rotate"){
if(stage.step === "idle"){ stage.step = "rot"; stage.note = ""; }
else if(stage.step === "rot"){
if(stage.angle === q.targetAngle){ stage.step = "exp"; stage.note = "向きが合った。あとは納品だけ。"; }
else{ stage.rotMiss++; stage.note = "見本と向きが違う。回す量を変えてみて。"; }
}
refreshCanvas();
}
else if(id === "mawasu" && q.type === "render"){
if(stage.step === "rot"){
if(stage.angle === q.targetAngle){ stage.step = "light"; stage.note = "向きは決まった。最後は光。"; }
else{ stage.rotMiss++; stage.note = "扉の向きが見本と違う。"; }
}
refreshCanvas();
}
else if(id === "hikari" && q.type === "light"){
if(stage.step === "idle"){ stage.step = "light"; stage.note = ""; }
else if(stage.step === "light"){
var dl = Math.abs(((stage.lightAng - q.targetLight + 540) % 360) - 180);
if(dl <= 25){ stage.step = "exp"; stage.note = "光が合った。あとは納品だけ。"; }
else{ stage.lightMiss++; stage.note = "見本と光の向きがまだ違う。影の向きを見て。"; }
}
refreshCanvas();
}
else if(id === "hikari" && q.type === "render"){
if(stage.step === "light"){
var dl2 = Math.abs(((stage.lightAng - q.targetLight + 540) % 360) - 180);
if(dl2 <= 25){ stage.step = "exp"; stage.note = "仕上がった。あとは納品だけ。"; }
else{ stage.lightMiss++; stage.note = "夕方の光はもっと低い。影の向きを見て。"; }
}
refreshCanvas();
}
else if(id === "oku" && (q.type === "scene" || q.type === "build")){
if(stage.step === "idle"){ stage.step = "place"; stage.note = ""; }
else if(stage.step === "place"){
var diffS = 0;
Object.keys(q.targets).forEach(function(k){ if(stage.placements[k]!== q.targets[k]) diffS++; });
Object.keys(stage.placements).forEach(function(k){ if(!(k in q.targets)) diffS++; });
if(diffS === 0){
if(q.type === "build"){ stage.step = "link"; stage.note = "置けた。次は つなぐ。"; }
else{ stage.step = "exp"; stage.note = "見本どおり。あとは納品だけ。"; }
}else{ stage.sceneMiss++; stage.note = "見本と違うマスが " + diffS + " か所ある。うすい絵のマスを見て。"; }
}
refreshCanvas();
}
else if(id === "tsunagu" && q.type === "connect"){
if(stage.step === "idle"){ stage.step = "link"; stage.note = ""; }
refreshCanvas();
}
else if(id === "tsunagu" && q.type === "build"){
stage.note = "ノードを2つ順にクリックして結んで。";
refreshCanvas();
}
else if(id === "oku" && q.type === "photoscene"){
if(stage.step === "idle"){ stage.step = "place"; stage.note = ""; }
else if(stage.step === "place"){
if(q.spots.every(function(_, i){ return stage.spotPlaced[i]; })){ stage.step = "exp"; stage.note = "再現できた。あとは保存だけ。"; }
else{ stage.sceneMiss++; stage.note = "まだ置けていない場所がある。"; }
}
refreshCanvas();
}
else if(id === "makaseru" && q.type === "aifix"){
if(stage.step === "idle"){ stage.step = "fix"; stage.note = "エージェントの下書きができた。ずれている赤いポイントを直して。"; }
refreshCanvas();
}
else if(id === "ugokasu" && (q.type === "move" || q.type === "build")){
var stepName = q.type === "build" ? "move" : "path";
if(stage.step === "idle"){ stage.step = stepName; stage.note = ""; }
else if(stage.step === stepName){
var lastCell = stage.path[stage.path.length - 1];
var wps = q.waypoints || [q.waypoint];
var allWp = wps.every(function(w){ return stage.path.indexOf(w) >= 0; });
if(lastCell === q.goal && allWp){
stage.step = "exp"; stage.note = "巡回路ができた。あとは納品だけ。";
}else{
stage.pathMiss++; stage.path = [q.start];
stage.note = lastCell!== q.goal ? "ゴールまで届いていない。旗を通ってゴールへ。" : "旗のマスを通っていない。";
}
}
refreshCanvas();
}
else if(id === "exp" && q.type === "adjust" && stage.step === "adjust"){
var j = judgeAdjust(stage.adj.b, stage.adj.h, q.targetB, q.targetH);
if(j.ok){ stage.adjustScore = j.score; finishQuest(); return;}
stage.adjMiss++;
stage.note = "差し戻し。まだ見本と違う。" + (Math.abs(stage.adj.b - q.targetB) > 14 ? "明るさが足りない／強すぎる。" : "") + (Math.abs(stage.adj.h - q.targetH) > 16 ? "色の寄りが残っている。" : "");
}
else if(id === "exp"){ finishQuest(); return;}
updateUI();
}

/* ================= pointer ================= */
function cvPos(ev){
var r = cv.getBoundingClientRect();
return { x:(ev.clientX - r.left) * 480 / r.width, y:(ev.clientY - r.top) * 320 / r.height};
}
function normSel(a, b){
return { x:Math.min(a.x, b.x), y:Math.min(a.y, b.y), w:Math.abs(a.x - b.x), h:Math.abs(a.y - b.y)};
}
cv.addEventListener("pointerdown", function(ev){
if(!stage ||!S.accepted || stage.finished) return;
var p = cvPos(ev), q = stage.q;
if(q.type === "cutfill" && stage.step === "cut"){
stage.drag = p; cv.setPointerCapture(ev.pointerId);
}
else if(q.type === "erase" && stage.step === "erase"){
var i = hitFlaw(q.flaws, stage.erased, p.x, p.y);
if(i >= 0){
stage.erased[i] = true;
var left = stage.erased.filter(function(e){ return!e;}).length;
if(left === 0){ stage.step = "exp"; stage.note = "全部消えたね。あとは納品だけ。";}
else stage.note = "消えた。残り " + left + " か所。";
}else{
stage.misclicks++;
stage.note = "そこは汚れていないよ。消しすぎは写真を傷める。よく見て。";
}
refreshCanvas(); updateUI();
}
else if(q.type === "place" && stage.step === "place"){
if(p.x >= stage.pos.x && p.x <= stage.pos.x + SPR_W && p.y >= stage.pos.y && p.y <= stage.pos.y + SPR_H){
stage.dragging = true;
stage.dragOff = { x:p.x - stage.pos.x, y:p.y - stage.pos.y};
cv.setPointerCapture(ev.pointerId);
}
}
else if(q.type === "banner" && stage.step === "pos"){
var z = q.textZone;
if(p.x >= z.x && p.x <= z.x + z.w && p.y >= z.y && p.y <= z.y + z.h){
stage.textPlaced = true; stage.step = "exp"; stage.note = "いい場所。商品にも被っていない。";
}else{
stage.posMiss++;
stage.note = "そこは商品に被るか、余白から外れている。左側の空いた場所に。";
}
refreshCanvas(); updateUI();
}
else if(q.type === "blur" && stage.step === "blur"){
stage.drag = p; cv.setPointerCapture(ev.pointerId);
}
else if(q.type === "spotcolor" && stage.step === "spot"){
var t = q.target;
if(p.x >= t.x - 6 && p.x <= t.x + t.w + 6 && p.y >= t.y - 6 && p.y <= t.y + t.h + 6){
stage.spotDone = true; stage.step = "exp"; stage.note = "赤だけ残った。その調子。";
}else{
stage.spotMiss++;
stage.note = "それは赤いポーションじゃないよ。本の手前の、赤い小瓶。";
}
refreshCanvas(); updateUI();
}
else if(q.type === "trim" && stage.step === "trim"){
stage.frameDrag = { dx:p.x - stage.frame.x, dy:p.y - stage.frame.y};
cv.setPointerCapture(ev.pointerId);
}
else if(q.type === "trim" && stage.step === "pos"){
var z2 = q.textZone;
if(p.x >= z2.x && p.x <= z2.x + z2.w && p.y >= z2.y && p.y <= z2.y + z2.h){
stage.textPlaced = true; stage.step = "exp"; stage.note = "空に置けた。あとは納品だけ。";
}else{
stage.posMiss++;
stage.note = "そこは景色に被る。構図の左上、空の部分に。";
}
refreshCanvas(); updateUI();
}
else if((q.type === "trace" || q.type === "logo") && stage.step === "trace"){
var pts = questPoints(q), tp = pts[stage.traceHit];
if(tp){
var d = Math.hypot(p.x - tp.x, p.y - tp.y);
if(d <= 18){
stage.traceHit++; stage.traceErr += d;
if(stage.traceHit >= pts.length){
if(q.type === "trace"){ stage.step = "exp"; stage.note = "星が完成した。あとは納品だけ。"; }
else{ stage.step = "color"; stage.note = "輪郭ができた。次は店の色。"; }
}else stage.note = "";
}else{
stage.traceMiss++;
stage.note = "光っているポイントを順に押して。";
}
}
refreshCanvas(); updateUI();
}
else if(q.type === "align" && stage.step === "align"){
for(var ii = stage.alignPos.length - 1; ii >= 0; ii--){
var ip = stage.alignPos[ii];
if(!ip.locked && Math.hypot(p.x - ip.x, p.y - ip.y) <= 28){
stage.dragItem = ii;
stage.dragOff = { x:p.x - ip.x, y:p.y - ip.y };
cv.setPointerCapture(ev.pointerId);
break;
}
}
}
else if(q.type === "logo" && stage.step === "place"){
var mz = q.markZone;
if(p.x >= mz.x && p.x <= mz.x + mz.w && p.y >= mz.y && p.y <= mz.y + mz.h){
stage.markPlaced = true; stage.step = "exp"; stage.note = "ロゴが決まった。あとは納品だけ。";
}else{
stage.posMiss++;
stage.note = "マークは左の点線の枠の中に。";
}
refreshCanvas(); updateUI();
}
else if(q.type === "model" && stage.step === "build"){
var ci = nearestCell(p, q.cols, q.rows);
if(ci >= 0){ stage.heights[ci] = (stage.heights[ci] + 1) % 4; stage.note = ""; }
refreshCanvas(); updateUI();
}
else if(q.type === "rotate" && stage.step === "rot"){
stage.rotDrag = { x:p.x, angle:stage.angle };
cv.setPointerCapture(ev.pointerId);
}
else if(q.type === "light" && stage.step === "light"){
var sp = sunPos(stage.lightAng);
if(Math.hypot(p.x - sp.x, p.y - sp.y) <= 36){
stage.sunDrag = true;
stage.lightAng = (Math.atan2(p.y - 165, p.x - 240) * 180 / Math.PI + 360) % 360;
cv.setPointerCapture(ev.pointerId);
refreshCanvas();
}
}
else if(q.type === "photoscene" && stage.step === "place"){
if(!stage.selObj){ stage.note = "先に素材を選んで。"; }
else{
var hitS = -1;
q.spots.forEach(function(sp, i){ if(!stage.spotPlaced[i] && Math.hypot(p.x - sp.x, p.y - sp.y) <= 32) hitS = i; });
if(hitS >= 0){
var sp2 = q.spots[hitS];
if(sp2.o === stage.selObj){
stage.spotPlaced[hitS] = true;
var leftS = q.spots.filter(function(_, i){ return!stage.spotPlaced[i]; }).length;
stage.note = leftS === 0 ? "全部置けた。あとは照合と保存。" : "置けた。残り " + leftS + " か所。";
}else{
stage.sceneMiss++;
var want = null; q.objects.forEach(function(o){ if(o.id === sp2.o) want = o; });
stage.note = "そこは「" + (want? want.label: "") + "」の場所みたい。";
}
}
}
refreshCanvas(); updateUI();
}
else if(q.type === "aifix" && stage.step === "fix"){
var ptsA = starPoints(q.shape.cx, q.shape.cy, q.shape.R, q.shape.r);
var hitFix = false;
for(var wi = 0; wi < q.wrong.length; wi++){
var w = q.wrong[wi];
if(stage.fixedWrong[w.i]) continue;
var wp = { x:ptsA[w.i].x + w.dx, y:ptsA[w.i].y + w.dy };
if(Math.hypot(p.x - wp.x, p.y - wp.y) <= 22){
stage.fixedWrong[w.i] = true; hitFix = true;
var leftF = q.wrong.filter(function(x){ return!stage.fixedWrong[x.i]; }).length;
if(leftF === 0){ stage.step = "exp"; stage.note = "全部直った。あとは保存だけ。"; }
else stage.note = "直った。残り " + leftF + " か所。";
break;
}
}
if(!hitFix){
var nearOk = ptsA.some(function(pt, ix){
var isW2 = q.wrong.some(function(x){ return x.i === ix; });
return!isW2 && Math.hypot(p.x - pt.x, p.y - pt.y) <= 22;
});
if(nearOk){ stage.fixMiss++; stage.note = "そこは合っている。赤いポイントだけ直して。"; }
}
refreshCanvas(); updateUI();
}
else if((q.type === "scene" || q.type === "build") && stage.step === "place"){
var ci3 = nearestCell(p, q.cols, q.rows);
if(ci3 >= 0){
if(!stage.selObj){ stage.note = "先に素材チップを選んで。"; }
else if(stage.placements[ci3] === stage.selObj){ delete stage.placements[ci3]; stage.note = ""; }
else{ stage.placements[ci3] = stage.selObj; stage.note = ""; }
}
refreshCanvas(); updateUI();
}
else if((q.type === "connect" || q.type === "build") && stage.step === "link"){
for(var ni = 0; ni < q.nodes.length; ni++){
var nd = q.nodes[ni];
if(Math.hypot(p.x - nd.x, p.y - nd.y) <= 32){ handleNodeClick(nd); break; }
}
}
else if(((q.type === "move" && stage.step === "path") || (q.type === "build" && stage.step === "move"))){
var ci4 = nearestCell(p, q.cols, q.rows);
if(ci4 >= 0 && stage.path){
var lastP = stage.path[stage.path.length - 1];
var lx = lastP % q.cols, ly = Math.floor(lastP / q.cols);
var px2 = ci4 % q.cols, py2 = Math.floor(ci4 / q.cols);
if(stage.path.length > 1 && ci4 === stage.path[stage.path.length - 2]){ stage.path.pop(); stage.note = ""; }
else if(Math.abs(px2 - lx) + Math.abs(py2 - ly) === 1 && stage.path.indexOf(ci4) < 0){ stage.path.push(ci4); stage.note = ""; }
else if(ci4!== lastP){ stage.note = "隣のマスを順にクリック。戻る時は1つ前のマスを押して。"; }
}
refreshCanvas(); updateUI();
}
else if(q.type === "render"){
if(stage.step === "place"){
var ci2 = nearestCell({ x:p.x, y:p.y - RENDER_DY }, q.cols, q.rows);
if(ci2 >= 0){ stage.placeCell = ci2; stage.note = ""; }
refreshCanvas(); updateUI();
}
else if(stage.step === "rot"){
stage.rotDrag = { x:p.x, angle:stage.angle };
cv.setPointerCapture(ev.pointerId);
}
else if(stage.step === "light"){
var sp2 = sunPos(stage.lightAng);
if(Math.hypot(p.x - sp2.x, p.y - sp2.y) <= 36){
stage.sunDrag = true;
stage.lightAng = (Math.atan2(p.y - 165, p.x - 240) * 180 / Math.PI + 360) % 360;
cv.setPointerCapture(ev.pointerId);
refreshCanvas();
}
}
}
});
cv.addEventListener("pointermove", function(ev){
if(!stage) return;
var p = cvPos(ev), q = stage.q;
if(q.type === "cutfill" && stage.drag){
var s = normSel(stage.drag, p);
refreshCanvas();
ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.setLineDash([7, 5]);
ctx.strokeRect(s.x, s.y, s.w, s.h); ctx.setLineDash([]);
}
else if(q.type === "place" && stage.dragging){
stage.pos.x = Math.max(0, Math.min(480 - SPR_W, p.x - stage.dragOff.x));
stage.pos.y = Math.max(0, Math.min(320 - SPR_H, p.y - stage.dragOff.y));
refreshCanvas();
}
else if(q.type === "blur" && stage.drag){
var s2 = normSel(stage.drag, p);
refreshCanvas();
ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.setLineDash([7, 5]);
ctx.strokeRect(s2.x, s2.y, s2.w, s2.h); ctx.setLineDash([]);
}
else if(q.type === "trim" && stage.frameDrag){
stage.frame.x = Math.max(0, Math.min(480 - q.frameW, p.x - stage.frameDrag.dx));
stage.frame.y = Math.max(0, Math.min(320 - q.frameH, p.y - stage.frameDrag.dy));
refreshCanvas();
}
else if(q.type === "align" && stage.dragItem >= 0){
var ip2 = stage.alignPos[stage.dragItem];
ip2.x = Math.max(20, Math.min(460, p.x - stage.dragOff.x));
ip2.y = Math.max(20, Math.min(300, p.y - stage.dragOff.y));
refreshCanvas();
}
else if(stage.rotDrag){
var steps = Math.round((p.x - stage.rotDrag.x) / 55);
stage.angle = (((stage.rotDrag.angle + steps) % 4) + 4) % 4;
refreshCanvas();
}
else if(stage.sunDrag){
stage.lightAng = (Math.atan2(p.y - 165, p.x - 240) * 180 / Math.PI + 360) % 360;
refreshCanvas();
}
});
cv.addEventListener("pointerup", function(ev){
if(!stage) return;
var p = cvPos(ev), q = stage.q;
if(q.type === "cutfill" && stage.drag){
var s = normSel(stage.drag, p); stage.drag = null;
if(s.w < 12 || s.h < 12){ refreshCanvas(); return;}
var sc = scoreSelection(s, TGT);
if(sc.cover >= 0.85 && sc.iou >= 0.45){
stage.sel = s; stage.iou = sc.iou; stage.step = "fill"; stage.fillArmed = false; stage.note = "";
refreshCanvas();
}else{
stage.note = sc.cover < 0.85? "ランタンが全部入っていません。もう少し大きく囲んで。":
"余白が大きすぎます。ランタンに寄せて囲んで。";
refreshCanvas();
}
updateUI();
}
else if(q.type === "place" && stage.dragging){
stage.dragging = false;
var bcx = stage.pos.x + SPR_W / 2, bcy = stage.pos.y + SPR_H;
var j = judgePlace(bcx - q.placeTarget.cx, bcy - q.placeTarget.cy);
stage.placeScore = j.score;
if(j.ok){ stage.step = "exp"; stage.note = "台の真ん中に置けた。あとは納品だけ。";}
else stage.note = "台の真ん中からずれている。点線の枠に合わせて置き直して。";
refreshCanvas(); updateUI();
}
else if(q.type === "blur" && stage.drag){
var s3 = normSel(stage.drag, p); stage.drag = null;
if(s3.w < 12 || s3.h < 12){ refreshCanvas(); return; }
var sc3 = scoreSelection(s3, q.subject);
if(sc3.cover >= 0.8 && sc3.iou >= 0.4){
stage.sharp = s3; stage.sharpIou = sc3.iou; stage.step = "exp"; stage.note = "";
refreshCanvas();
}else{
stage.note = sc3.cover < 0.8 ? "水晶が全部入っていません。もう少し大きく囲んで。" :
"余白が大きすぎます。水晶に寄せて囲んで。";
refreshCanvas();
}
updateUI();
}
else if(q.type === "trim" && stage.frameDrag){
stage.frameDrag = null;
var fr = { x:stage.frame.x, y:stage.frame.y, w:q.frameW, h:q.frameH};
var sc4 = scoreSelection(fr, q.ideal);
stage.frameIou = sc4.iou;
if(sc4.iou >= 0.68){ stage.step = "pos"; stage.note = "いい構図。次はタイトルの場所。"; }
else stage.note = "構図が理想とずれている。ランタンと水面の光が入る位置に動かして。";
refreshCanvas(); updateUI();
}
else if(q.type === "align" && stage.dragItem >= 0){
var di = stage.dragItem; stage.dragItem = -1;
var ip3 = stage.alignPos[di], sl = q.slots[di];
if(Math.hypot(ip3.x - sl.x, ip3.y - sl.y) <= 20){
ip3.x = sl.x; ip3.y = sl.y; ip3.locked = true;
var leftA = stage.alignPos.filter(function(a){ return!a.locked; }).length;
if(leftA === 0){ stage.step = "exp"; stage.note = "全部揃った。あとは納品だけ。"; }
else stage.note = "揃った。残り " + leftA + " つ。";
}else{
stage.strays++;
stage.note = "そこは形が違うか、位置がずれている。シルエットに合わせて。";
}
refreshCanvas(); updateUI();
}
else if(stage.rotDrag || stage.sunDrag){
stage.rotDrag = null; stage.sunDrag = false;
refreshCanvas(); updateUI();
}
});

/* ================= swatches / copies ================= */
$("swatches").addEventListener("click", function(ev){
var el = ev.target.closest(".sw");
if(!el ||!stage || stage.q.type!== "cutfill" || stage.step!== "fill") return;
if(el.dataset.c === FILL_OK){
stage.step = "exp"; stage.note = ""; refreshCanvas();
}else{
stage.fillMiss++;
stage.note = "色が違います。指示は みずいろ です。指示文はよく読むこと。";
}
updateUI();
});
function renderChips(){
var wrap = $("copies"); wrap.innerHTML = "";
if(!stage) return;
var q = stage.q;
if(q.type === "banner"){
q.copies.forEach(function(cp, i){
var b = document.createElement("button");
b.className = "btn"; b.textContent = cp.t;
b.addEventListener("click", function(){
if(!stage || stage.q.type!== "banner" || stage.step!== "copy") return;
if(cp.ok){ stage.copyIdx = i; stage.step = "pos"; stage.note = "そのコピーでいこう。次は置く場所。";}
else{ stage.copyMiss++; stage.note = cp.why;}
refreshCanvas(); updateUI();
});
wrap.appendChild(b);
});
}else if(q.type === "combine"){
q.palette.forEach(function(name){
var b = document.createElement("button");
b.className = "btn"; b.textContent = name;
b.dataset.chip = name;
b.classList.toggle("armed", stage.pick.indexOf(name) >= 0);
b.addEventListener("click", function(){
var ix = stage.pick.indexOf(name);
if(ix >= 0) stage.pick.splice(ix, 1);
else if(stage.pick.length < 2) stage.pick.push(name);
refreshCanvas(); updateUI();
});
wrap.appendChild(b);
});
}else if(q.type === "scene" || q.type === "build" || q.type === "photoscene"){
q.objects.forEach(function(o){
var b = document.createElement("button");
b.className = "btn"; b.textContent = o.emoji + " " + o.label;
b.dataset.chip = o.id;
b.classList.toggle("armed", stage.selObj === o.id);
b.addEventListener("click", function(){
stage.selObj = (stage.selObj === o.id ? null : o.id);
refreshCanvas(); updateUI();
});
wrap.appendChild(b);
});
}else if(q.type === "logo"){
q.palettes.forEach(function(pal, i){
var b = document.createElement("button");
b.className = "btn"; b.textContent = pal.name;
b.dataset.chip = pal.name;
b.addEventListener("click", function(){
if(pal.ok){ stage.logoColor = i; stage.step = "place"; stage.note = "その色でいこう。あとはマークの場所。";}
else{ stage.colorMiss++; stage.note = pal.why;}
refreshCanvas(); updateUI();
});
wrap.appendChild(b);
});
}
}

/* ================= adjust sliders ================= */
function syncSliders(){
if(!stage) return;
$("adjB").value = stage.adj.b;
$("adjH").value = stage.adj.h;
$("adjNote").textContent = stage.q.adjNote || "見本：昼の明るい光で撮ったような、品物の色がそのまま出ている感じに。";
}
$("adjB").addEventListener("input", function(){ if(stage && stage.q.type === "adjust"){ stage.adj.b = +this.value; refreshCanvas(); }});
$("adjH").addEventListener("input", function(){ if(stage && stage.q.type === "adjust"){ stage.adj.h = +this.value; refreshCanvas(); }});

/* ================= finish ================= */
function finishQuest(){
var q = stage.q, gains = {}, lines = [];
if(q.type === "cutfill"){
var rank = rankFromIou(stage.iou);
var bonus = rank === "S"? 10: (rank === "A"? 6: 2);
gains.kiritoru = 12 + bonus;
gains.nuru = Math.max(4, 10 - stage.fillMiss * 2);
lines.push("納品完了！ 判定ランク " + rank + "（囲み方の一致度 " + Math.round(stage.iou * 100) + "%）");
lines.push("初めてにしては上出来。段取りが分かったね。");
}
else if(q.type === "erase"){
gains.kesu = Math.max(8, 16 - stage.misclicks * 2);
lines.push("納品完了！ 汚れ 5/5 か所を消去（消しすぎ " + stage.misclicks + " 回）");
lines.push("きれいになった。消す作業は「やりすぎない」のが腕だよ。");
}
else if(q.type === "place"){
gains.kasaneru = 10 + Math.round(10 * stage.placeScore);
lines.push("納品完了！ 配置の精度 " + Math.round(stage.placeScore * 100) + "%");
lines.push("昨日の切り抜きが今日の景色になった。合成は段取りの積み重ねだね。");
}
else if(q.type === "banner"){
gains.mojiire = Math.max(7, 16 - stage.copyMiss * 3 - stage.posMiss * 2);
lines.push("納品完了！ バナー完成（コピーの選び直し " + stage.copyMiss + " 回、置き直し " + stage.posMiss + " 回）");
lines.push("基本の5つが揃ったね。次は応用編だ。");
}
else if(q.type === "adjust"){
gains.naosu = Math.max(8, 10 + Math.round(8 * (stage.adjustScore || 0)) - stage.adjMiss * 2);
lines.push("納品完了！ 補正の一致度 " + Math.round((stage.adjustScore || 0) * 100) + "%（差し戻し " + stage.adjMiss + " 回）");
lines.push("色は「正解を当てる」ものじゃない。見本と見比べて寄せる、地道な作業だよ。");
}
else if(q.type === "blur"){
var rank6 = rankFromIou(stage.sharpIou);
var bonus6 = rank6 === "S"? 10: (rank6 === "A"? 6: 2);
gains.bokasu = 12 + bonus6;
lines.push("納品完了！ 判定ランク " + rank6 + "（囲み方の一致度 " + Math.round(stage.sharpIou * 100) + "%）");
lines.push("主役が浮き出た。ぼかしは「引く」演出だね。");
}
else if(q.type === "spotcolor"){
gains.ironokosu = Math.max(8, 15 - stage.spotMiss * 3);
lines.push("納品完了！ 赤いポーションだけ色を残した（選び直し " + stage.spotMiss + " 回）");
lines.push("色を残す場所を決めるのは、色を塗るのと同じくらい大事だ。");
}
else if(q.type === "trim"){
gains.kiritoru = 8 + Math.round(6 * stage.frameIou);
gains.mojiire = Math.max(4, 8 - stage.posMiss * 2);
lines.push("納品完了！ 卒業制作のバナー完成（構図の一致度 " + Math.round(stage.frameIou * 100) + "%）");
lines.push("フォトショ編、卒業だね。8つの仕事、よくやり切った。次のツールもこの調子で。");
}
else if(q.type === "trace"){
var avgErr = stage.traceHit? stage.traceErr / stage.traceHit: 99;
var accBonus = avgErr <= 6? 6: (avgErr <= 12? 3: 0);
gains.kaku = Math.max(8, 12 + accBonus - stage.traceMiss);
lines.push("納品完了！ 星のマーク完成（ポイントの外し " + stage.traceMiss + " 回、平均のずれ " + avgErr.toFixed(1) + "px）");
lines.push("ベクターは拡大しても荒れない。看板にぴったりの作り方だね。");
}
else if(q.type === "align"){
gains.naraberu = Math.max(8, 16 - stage.strays * 2);
lines.push("納品完了！ 飾り5つが整列（置き直し " + stage.strays + " 回）");
lines.push("揃えるだけで、こんなに看板らしくなる。配置は地味で大事な技術だよ。");
}
else if(q.type === "combine"){
gains.awaseru = Math.max(8, 16 - stage.combineMiss * 3);
lines.push("納品完了！ しかく＋さんかくで家ができた（組み直し " + stage.combineMiss + " 回）");
lines.push("形の足し算が分かると、描けるものの幅が一気に広がるよ。");
}
else if(q.type === "logo"){
var avgErr12 = stage.traceHit? stage.traceErr / stage.traceHit: 99;
gains.kaku = Math.max(6, 8 + (avgErr12 <= 8? 4: 1) - Math.floor(stage.traceMiss / 2));
gains.naraberu = Math.max(6, 10 - stage.posMiss * 2);
lines.push("納品完了！ ロゴマーク完成（色の選び直し " + stage.colorMiss + " 回）");
lines.push("イラレ編、卒業だね。線と形で作る力がついた。次のツールは3Dだよ。");
}
else if(q.type === "model"){
gains.tsukuru = Math.max(8, 16 - stage.buildMiss * 2) + (stage.buildMiss === 0 ? 4 : 0);
lines.push("納品完了！ 見本どおりの立体ができた（照合のやり直し " + stage.buildMiss + " 回）");
lines.push("積む、が3Dの第一歩。次は回してみよう。");
}
else if(q.type === "rotate"){
gains.mawasu = Math.max(8, 15 - stage.rotMiss * 3);
lines.push("納品完了！ 建物の向きが決まった（照合のやり直し " + stage.rotMiss + " 回）");
lines.push("向きを決めることは、見せ方を決めることだよ。");
}
else if(q.type === "light"){
gains.hikari = Math.max(8, 15 - stage.lightMiss * 3);
lines.push("納品完了！ 光の向きが合った（照合のやり直し " + stage.lightMiss + " 回）");
lines.push("箱庭の美しさは、形よりも光で決まることが多いんだ。");
}
else if(q.type === "render"){
gains.tsukuru = Math.max(6, 9 - stage.placeMiss * 2);
gains.mawasu = Math.max(6, 9 - stage.rotMiss * 2);
gains.hikari = Math.max(6, 9 - stage.lightMiss * 2);
lines.push("納品完了！ 湖畔のランタンが仕上がった");
lines.push("ポーザー編、卒業だね。置く・回す・照らすが揃った。次の「ゆにてぃ」では、世界そのものを作るよ。");
}
else if(q.type === "scene"){
gains.oku = Math.max(8, 16 - stage.sceneMiss * 2) + (stage.sceneMiss === 0 ? 4 : 0);
lines.push("納品完了！ シーンが見本どおりになった（照合のやり直し " + stage.sceneMiss + " 回）");
lines.push("素材は、置かれて初めて世界になる。次はしかけだよ。");
}
else if(q.type === "connect"){
gains.tsunagu = Math.max(8, 15 - stage.linkMiss * 3);
lines.push("納品完了！ しかけが全部つながった（結び直し " + stage.linkMiss + " 回）");
lines.push("つなぐ、はプログラムの入口。物の間に意味が生まれたね。");
}
else if(q.type === "move"){
gains.ugokasu = Math.max(8, 15 - stage.pathMiss * 3);
lines.push("納品完了！ ボートの巡回路ができた（作り直し " + stage.pathMiss + " 回）");
lines.push("世界が動き出した。あとは卒業制作だけだよ。");
}
else if(q.type === "build"){
gains.oku = Math.max(6, 9 - stage.sceneMiss * 2);
gains.tsunagu = Math.max(6, 9 - stage.linkMiss * 2);
gains.ugokasu = Math.max(6, 9 - stage.pathMiss * 2);
lines.push("納品完了！ 湖畔の世界が完成した");
lines.push("ゆにてぃ編、卒業だね。整える・描く・作る・置く・つなぐ・動かす。全部の道具が揃った。");
lines.push("あとは、作りたい世界を思い描くだけだよ。");
}
else if(q.type === "photoscene"){
gains.oku = Math.max(8, 16 - stage.sceneMiss * 2);
lines.push("保存完了！ 最初のシーンを再現した（置き直し " + stage.sceneMiss + " 回）");
lines.push("タイルと素材だけの画面。それでも、あの日は「世界ができた」と思えたんだ。");
}
else if(q.type === "aifix"){
gains.makaseru = Math.max(8, 15 - stage.fixMiss * 3);
lines.push("保存完了！ エージェントの下書きを仕上げた（見直し " + stage.fixMiss + " 回）");
lines.push("エージェントが仲間になった。デスクトップにアイコンが増えているよ。");
}
if(q.doneLines) lines = q.doneLines.slice();
var msg = lines[0] + "\n";
var titleBefore = titleFor(totalXp());
SKILLS.forEach(function(k){
if(!gains[k.id]) return;
var before = lvFromXp(S.skills[k.id].xp).lv;
S.skills[k.id].xp += gains[k.id];
var after = lvFromXp(S.skills[k.id].xp).lv;
msg += k.label + " +" + gains[k.id] + " 経験値" +
(after > before? "　<span class='lvup'>" + k.label + " Lv" + after + " に上がった！</span>": "") + "\n";
});
var titleAfter = titleFor(totalXp());
if(titleAfter!== titleBefore) msg += "<span class='lvup'>称号が「" + titleAfter + "」に上がった！</span>\n";
msg += lines[1];
S.progress++; S.accepted = false;
stage.finished = true; stage.step = "done";
save();
$("resultBox").innerHTML = msg;
$("resultBox").classList.add("on");
refreshCanvas(); updateUI();
}

/* ================= title ================= */
function enterGame(fresh){
if(fresh){
var f = freshState();
S.skills = f.skills; S.progress = 0; S.accepted = false;
stage = null;
$("resultBox").classList.remove("on");
save();
}
$("title").classList.remove("on");
$("game").classList.add("on");
refreshCanvas(); renderStatus();
}
$("btnStart").addEventListener("click", function(){ enterGame(true);});
$("btnContinue").addEventListener("click", function(){ enterGame(false);});
if(hasSave()) $("btnContinue").style.display = "block";
renderStatus();

/* test hook */
window.__we = {
state:S, QUESTS:QUESTS, scoreSelection:scoreSelection, rankFromIou:rankFromIou,
lvFromXp:lvFromXp, judgePlace:judgePlace, judgeAdjust:judgeAdjust, hitFlaw:hitFlaw, migrate:migrate, starPoints:starPoints, questPoints:questPoints, cellCenter:cellCenter, sunPos:sunPos, rotCells:rotCells, RENDER_DY:(typeof RENDER_DY !== "undefined" ? RENDER_DY : 92),
TGT:TGT, enterGame:enterGame,
getStage:function(){ return stage;},
isReady:function(id){ return PH[id]? PH[id].ready: false;}
};
</script>
</body>
</html>
